services:
  - type: web
    name: prime-hosting-dashboard
    runtime: python
    rootDir: web
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: prime-hosting-db
          property: connectionString
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD_HASH
        sync: false
      - key: AGENT_URL
        sync: false
      - key: AGENT_TOKEN
        sync: false
      - key: MAX_UPLOAD_MB
        value: "50"
      - key: BOOTSTRAP_ADMIN
        value: "true"
databases:
  - name: prime-hosting-db
    plan: basic-256mb
