{% extends "base.html" %}{% block content %}<section class="auth glass"><div class="eyebrow">✦ PRIME ACCOUNT</div><h2>{{'Create your account' if mode=='register' else 'Welcome back'}}</h2><p class="muted">Secure access to your hosting workspace.</p><form method="post"><label>Email address</label><input name="email" type="email" required autocomplete="email" placeholder="you@example.com"><label>Password</label><input name="password" type="password" required minlength="{{10 if mode=='register' else 1}}" autocomplete="{{'new-password' if mode=='register' else 'current-password'}}" placeholder="••••••••••"><button class="btn primary full">{{'Create account' if mode=='register' else 'Login securely'}} →</button></form><p class="switch">{% if mode=='register' %}Already registered? <a href="/login">Login</a>{% else %}New here? <a href="/register">Create account</a>{% endif %}</p></section>{% endblock %}
